<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <title>3의 배수 합 계산</title>
</head>
<body>
    <script>
        var text1 = "함수 선언 전 호출";
        var text2 = "함수 선언 후 호출";
        printMSG(text1);
        function printMSG(msg) {
            document.write("함수 호출 메시지 : " + msg + "<br>");
        }
        printMSG(text2);
    </script>
</body>
</html>
