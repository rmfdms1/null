<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <title>do...while 문 예제</title>
</head>
<body>
    <script>
        var x = 1;
        var sum = 0;
        do {
            sum += x;
            x++;
        } while (x <= 100);
        document.write("1~100까지 합 : <b>" + sum + "</b>");
    </script>
</body>
</html>
