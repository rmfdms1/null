<!DOCTYPE html>
<html>
<head>
    <title>Get 방식</title>
</head>
<body>
    <form>
        <p>쓰기기능 : <input type="text" name="name" size="20" placeholder="이름을 입력하세요" autofocus></p>
        <p>읽기기능 : <input type="text" name="name" size="10" readonly></p>
        <p>사용안함 : <input type="text" name="name" size="10" disabled></p>
        <p>자동완 : <input type="text" name="name" size="10" autocomplete="on" required></p>
        <textarea name="" id=""></textarea>
    </form>
</body>

</html>
