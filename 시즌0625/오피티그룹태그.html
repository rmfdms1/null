<!DOCTYPE html>
<html>
<head>
    <title>Get 방식</title>
</head>
<body>
    <H3>그룹별 선택 항목 제공</H3>
    <form>
        <label>전공 분야를 선택
        <select name="major">
            <optgroup label="computer">
                <optgroup>Software</optgroup>
                <optgroup>Robot</optgroup>
                <optgroup>System</optgroup>
            </optgroup>
            <optgroup label="language">
                <optgroup selected>Korea</optgroup>
                <optgroup>English</optgroup>
                <optgroup>China</optgroup>
                <optgroup>Germany</optgroup>
            </optgroup>
            <optgroup label="business">
                <optgroup>Servise</optgroup>
                <optgroup>Education</optgroup>
                <optgroup>Communication</optgroup>
                <optgroup>Marketing</optgroup>
            </optgroup>
        </select>
        <p></p>
        <input type="submit" value="선택">
        <input type="reset" value="다시선택">
        </label>
    </form>
</body>
</html>
