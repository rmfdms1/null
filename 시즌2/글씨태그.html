<!DOCTYPE html>
<html>
<head>
    <itle>Document</title>
</head>
<body>
    <header>
        <center>
            <h2>&lt; 텍스트 관련 태그 &gt;</h2>
        </center>
    </header>
    <section>
        <article>
            <b><p>텍스트 볼드 처리</p></b>
            <strong><p>텍스트 중요 표시</p></strong>
            <p><i>텍스트를 이탤릭체로</i></p>
            <p><em>텍스트 강조 표시</em></p>
            <p><ins>텍스트 밑줄 처리</ins></p>
            <p><del>텍스트 가운데 선 처리</del></p>
            <p>텍스트<sub>아래첨자</sub>텍스트<sup>윗첨자</sup></p>
            <p><mark>텍스트에 하이라이트 표시</mark></p>
        </article>
    </section>
</body>
</html>
