                <tr>
                    <td>3row 2heat</td>

            </table>
        </article>

    <p></p>
    <section>
        <article>
            <table border="1" style="width:50%">
                <caption>heat table</caption>
                <tr>
                    <th>1heat</th>
                    <th colspan="2">2heat</th>
                </tr>
                <tr>
                    <td>2row 1heat</td>
                    <td>2row 2heat</td>
                    <td>2row 3heat</td>
                </tr>
            </table>
        </article>
    </section>
