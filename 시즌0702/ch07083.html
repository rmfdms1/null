<!DOCTYPE html>
<html lang="ko"><head>
	<meta charset="UTF-8" />
	<title>이미지 그림자 예제</title>
	<style>
		img {
			padding: 20px;
			margin: 20px;
		}
		.shadow1 { /* Bottom right corner */
			box-shadow: 5px 5px 10px #000;
		}
		.shadow2 { /* Up right corner */
			box-shadow: 5px -5px 10px #000;
		}
	</style>
</head><body>
	<img src="pic1.jpg" class="shadow1" alt="이미지1">
	<img src="pic2.jpg" class="shadow2" alt="이미지2">
</body></html>
