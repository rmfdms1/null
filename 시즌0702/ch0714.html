<!DOCTYPE html>
<html lang="ko"><head>
	<meta charset="UTF-8" />
	<title>Float & Clear 예제</title>
	<style>
		.div1 {
			float: left;
			width: 100px;
			height: 50px;
			margin: 10px;
			border: 3px solid #73AD21;
		}
		.div2 {
			border: 1px solid red;
		}
		.div3 {
			float: left;
			width: 100px;
			height: 50px;
			margin: 10px;
			border: 3px solid #73AD21;
		}
		.div4 {
			border: 1px solid red;
			clear: left;
		}
	</style>
</head><body>
	<h2>float과 clear 속성 예제</h2>

	<div class="div1">float: left</div>
	<div class="div2">clear 없음</div>

	<div class="div3">float: left</div>
	<div class="div4">clear: left 적용</div>
</body></html>
