<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>달 탐사 타임라인 메인</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <div class="planet-container" id="planet-container">
    <div class="planet-button usa" data-link="usa.html">
      미국
      <div class="planet-tooltip">아폴로 계획 등 선도적인 유인 달 탐사</div>
    </div>
    <div class="planet-button china" data-link="china.html">
      중국
      <div class="planet-tooltip">창어 시리즈, 세계 최초 달 뒷면 착륙</div>
    </div>
    <div class="planet-button russia" data-link="soviet.html">
      소련
      <div class="planet-tooltip">루나 계획, 인류 최초의 달 무인 착륙</div>
    </div>
    <div class="planet-button japan" data-link="japan.html">
      일본
      <div class="planet-tooltip">가구야, SLIM 등 정밀 궤도 탐사</div>
    </div>
    <div class="planet-button india" data-link="india.html">
      인도
      <div class="planet-tooltip">찬드라얀 시리즈, 남극 착륙 성공</div>
    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
