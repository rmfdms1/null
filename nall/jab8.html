<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>N1 로켓</title>
<style>
  /* 전체 레이아웃: 좌우 파란색 배경 */
  body, html {
    margin: 0; padding: 0; height: 100%;
    background-color: #004080; /* 진한 파랑 */
    font-family: '맑은 고딕', sans-serif;
    color: white;
  }
  /* 플렉스 박스로 수평 정렬, 좌우는 flex-grow로 채움 */
  .container {
    display: flex;
    height: 100vh;
    width: 100vw;
  }
  .side {
    flex-grow: 1;
    background-color: #0066cc; /* 조금 밝은 파랑 */
  }
  .center {
    flex-grow: 0;
    width: 800px;
    background-color: #003366; /* 중앙 배경 더 진한 파랑 */
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 30px;
    box-sizing: border-box;
  }
  .floating-back {
  position: fixed;
  left: 20px;
  top: 3%;
  transform: translateY(-50%);
  background-color: rgba(255, 255, 255, 0.9);
  color: #003366;
  text-decoration: none;
  border-radius: 50%;
  width: 50px;
  height: 50px;
  font-size: 2rem;
  font-weight: bold;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 10px rgba(0,0,0,0.3);
  z-index: 999;
  transition: background-color 0.3s, color 0.3s;
}
.floating-back:hover {
  background-color: #ffcc00;
  color: #000;
}
  /* 제목 스타일 */
  h1 {
    margin: 0 0 20px 0;
    font-size: 3rem;
    font-weight: bold;
    text-align: center;
  }

  /* 이미지 스타일 */
  .image-area {
    max-width: 100%;
    margin-bottom: 20px;
  }
  .image-area img {
    max-width: 100%;
    height: auto;
    border-radius: 10px;
    box-shadow: 0 0 15px rgba(255,255,255,0.3);
  }

  /* 설명 텍스트 */
  .description {
    font-size: 1.2rem;
    line-height: 1.6;
    text-align: center;
    user-select: text;
  }

  /* 반응형 (화면 좁아질 때) */
  @media (max-width: 900px) {
    .container {
      flex-direction: column;
    }
    .side {
      height: 50px;
      width: 100%;
    }
    .center {
      width: 100%;
      height: calc(100vh - 100px);
      padding: 20px;
    }
  }
</style>
</head>
<body>

<div class="container">
  <div class="side"></div>

  <main class="center" role="main" aria-label="설명 컨텐츠 영역">
    <h1 id="title">여기에 제목이 들어갑니다</h1>

    <div class="image-area" id="image-area">
      <!-- 이미지가 여기에 표시됩니다 -->
      <img src="example.jpg" alt="설명 이미지" id="main-image" />
    </div>

    <div class="description" id="description">
      여기에 설명 내용이 표시됩니다.
    </div>
  </main>

  <div class="side"></div>
</div>
<script>
  // 필요하면 자바스크립트로 내용 동적 변경 가능
  // 예시: 페이지 로드시 데이터 세팅
  window.onload = function() {
    const titleEl = document.getElementById('title');
    const imageEl = document.getElementById('main-image');
    const descEl = document.getElementById('description');

    // 예시 데이터 (필요하면 변경)
    titleEl.textContent = "N1 로켓";
    imageEl.src = "N1 로켓.webp";
    imageEl.alt = "창어 1호 달 탐사선 이미지";
    descEl.innerHTML = `
소련이 1960년대 달탐사를 위해서 제작한 4단 로켓. 달착륙을 놓고 경쟁하던 미국의 새턴 V 로켓에 상응하는 로켓이었다.
   `; }
</script>
<a href="soviet.html" class="floating-back" aria-label="뒤로가기">←</a>
</body>
</html>
