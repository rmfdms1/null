<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>비밀 퀴즈 챌린지</title>
  <link rel="stylesheet" href="secret.css">
</head>
<body>
  <div class="quiz-container" id="quiz-container">
    아래 단상을 클릭해 퀴즈를 시작하세요!
  </div>

  <div class="pillars">
    <div class="pillar usa" data-country="usa">미국
      <img src="flag_usa.png" class="flag" id="flag-usa" />
    </div>
    <div class="pillar china" data-country="china">중국
      <img src="flag_china.png" class="flag" id="flag-china" />
    </div>
    <div class="pillar soviet" data-country="soviet">소련
      <img src="flag_soviet.png" class="flag" id="flag-soviet" />
    </div>
    <div class="pillar japan" data-country="japan">일본
      <img src="flag_japan.png" class="flag" id="flag-japan" />
    </div>
    <div class="pillar india" data-country="india">인도
      <img src="flag_india.png" class="flag" id="flag-india" />
    </div>
  </div>

  <script>
    const quizzes = {
      usa: Array(20).fill({ q: "1 + 1 = ?", a: "2" }),
      china: Array(20).fill({ q: "2 + 2 = ?", a: "4" }),
      soviet: Array(20).fill({ q: "3 + 3 = ?", a: "6" }),
      japan: Array(20).fill({ q: "4 + 4 = ?", a: "8" }),
      india: Array(20).fill({ q: "5 + 5 = ?", a: "10" })
    };

    const container = document.getElementById("quiz-container");
    const pillars = document.querySelectorAll(".pillar");

    pillars.forEach(pillar => {
      pillar.addEventListener("click", () => {
        const country = pillar.dataset.country;
        const quiz = quizzes[country];
        let current = 0;
        let correct = 0;

        function ask() {
          if (current >= quiz.length) {
            container.innerHTML = `${country.toUpperCase()} 퀴즈 완료!`;
            if (correct === 10) {
              document.getElementById(`flag-${country}`).style.display = 'block';
            }
            return;
          }

          const answer = prompt(quiz[current].q);
          if (answer === quiz[current].a) correct++;
          current++;
          ask();
        }

        ask();
      });
    });
  </script>
</body>
</html>
